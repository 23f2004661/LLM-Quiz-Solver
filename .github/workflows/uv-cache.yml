name: Uv set up and cache 
on: push 
jobs:
  build: 
    runs-on: ubuntu-latest
    steps: 
      - name: cache dependencies 
        id: cache-first
        uses: actions/cache@v4
        env: 
          cache-name: cache-ad39371
        with: 
          path: ~/.uvcache
          key: ${{ env.cache-name }}
      - name: prime-cache-ad39371
        run: echo ${{ steps.cache-packages.outputs.cache-hit }}
